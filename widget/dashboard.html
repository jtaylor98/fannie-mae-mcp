<!--
  Fannie Mae Business Dashboard -- WORKFLOW-oriented business-user surface (PoC, additive).

  Product model (see claude/fnma-business-dashboard-concept.md):
    Business Dashboard = business TASKS / workflows  ("What would you like to do?")
    API Explorer       = APIs / endpoints            (the existing power-user surface)

  Additive presentation/orchestration LAYER over the same engine (app.callServerTool
  -> call_fnma_api -> runOperation, lib/fanniemae.ts). No new FNMA logic / secrets.

  v0.3 -- visual/UX refinement pass (IA unchanged):
    - Property & Loan Snapshot styled as an enterprise report, not a web form.
    - Results hierarchy: property identity -> snapshot heading -> result cards ->
      supporting details (disclaimer + sources).
    - Cards: primary answer scannable, reference info visually subordinate.
    - Opportunity Zone simplified (no nested-card box).
    - "What does this mean?" affordances on each card (native <details>).
    - OPTIONAL deal inputs (qualifying income, loan amount, units) -> data-supported
      comparisons only (loan vs conforming limit; income vs HomeReady limit; units
      selects the applicable limit). No eligibility/approval implied.

  Dev preview: opened raw, a guarded mock host + verified sample payloads render so
  the workflow is clickable in a browser. Never runs in a built widget.
-->

const numOf=(s)=>{ const n=Number(String(s==null?"":s).replace(/[^0-9.]/g,"")); return isFinite(n)&&n>0?n:null; };
// Live currency formatting for monetary inputs ("$1,234,567") that preserves the
// caret by digit-count, so typing/editing in the middle isn't disrupted.
function formatMoneyInput(el){
  if(!el) return;
  const raw=el.value, pos=(el.selectionStart==null?raw.length:el.selectionStart);
  const digitsBefore=(raw.slice(0,pos).match(/\d/g)||[]).length;
  const digits=raw.replace(/\D/g,"");
  if(!digits){ if(el.value!=="") el.value=""; return; }
  const formatted="$"+Number(digits).toLocaleString("en-US");
  if(formatted!==raw) el.value=formatted;
  let idx=0,count=0;
  while(idx<formatted.length && count<digitsBefore){ if(/\d/.test(formatted[idx])) count++; idx++; }
  try{ if(document.activeElement===el) el.setSelectionRange(idx,idx); }catch(e){}
}
const UNIT_KEY={ "1":"oneUnitLimit","2":"twoUnitLimit","3":"threeUnitLimit","4":"fourUnitLimit" };

// ---- orchestration (verified FIPS bridge) ----
function parseAddress(raw){
  const parts=String(raw||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(parts.length<3) return null;
  const line1=parts[0].split(/\s+/);
  const number=line1.shift()||"";
  const street=line1.join(" ");
  const city=parts[1];
  const region=parts[parts.length-1].split(/\s+/).filter(Boolean);
  const state=(region[0]||"").toUpperCase();
  const zip=region[1]||"";
  if(!number||!street||!city||!state) return null;
  return { number, street, city, state, zip };
}
async function callOp(api_name, operation_id, params){
  const r=await app.callServerTool({ name:"call_fnma_api", arguments:{ api_name, operation_id, ...params } });
  if(r && r.isError) throw new Error((r.content&&r.content[0]&&r.content[0].text)||"Tool error");
  const text=r&&r.content&&r.content[0]&&r.content[0].text;
  try{ return JSON.parse(text); }catch{ return r&&r.structuredContent||{}; }
}
async function getLoanLimits(){ if(!loanLimitsCache) loanLimitsCache=await callOp("Loan Limits API","getAllLoanLimits",{}); return loanLimitsCache; }
const countyFips=(t)=> String(t||"").slice(0,5);

// ---- Snapshot enhancement: recent conforming loan-limit history for the matched county ----
// Lazy: only fetched when the user opens "Show recent limit history". getHistoricalLoanLimits
// returns the full national table per year (~1.2MB), so we fetch the last few years on demand,
// pull just the matched county's row (by FIPS), and cache all unit limits so changing the unit
// selector recomputes from cache without refetching.
const TREND_YEARS_BACK=5;
function limitTrendSeries(fips, unitKey){
  if(!(limitTrend.byYear && limitTrend.fips===fips)) return [];
  return Object.keys(limitTrend.byYear).map(Number).sort((a,b)=>a-b)
    .map(y=>({ y, v:(limitTrend.byYear[y]||{})[unitKey] })).filter(p=>p.v!=null);
}
async function loadLimitTrend(){
  if(!result || !result.loan) return;
  const r=result, fips=String(r.loan.fipsCode||"");
  if(!fips){ render(); return; }
  if(limitTrend.byYear && limitTrend.fips===fips){ render(); return; }   // already cached for this county
  const curYear=+String(r.loan.reportingYear||"").slice(0,4);
  limitTrend.loading=true; limitTrend.error=null; limitTrend.fips=fips; limitTrend.byYear=null; render();
  try{
    const byYear={};
    if(curYear) byYear[curYear]=(r.loan.issuers&&r.loan.issuers[0])||{};   // current year already in hand
    const years=[]; for(let y=curYear-TREND_YEARS_BACK; y<curYear; y++) if(y>0) years.push(y);
    const res=await Promise.all(years.map(y=> callOp("Loan Limits API","getHistoricalLoanLimits",{ year:y }).then(d=>({y,d})).catch(()=>({y,d:null}))));
    for(const it of res){ const row=((it.d&&it.d.loanLimit)||[]).find(x=>String(x.fipsCode)===fips); if(row) byYear[it.y]=(row.issuers&&row.issuers[0])||{}; }
    limitTrend.byYear=byYear;
  }catch(e){ limitTrend.error="Couldn't load the limit history right now."; }
  limitTrend.loading=false; render();
}
function limitTrendHtml(r, units){
  const fips=String(r.loan.fipsCode||"");
  if(!showTrend) return `<button class="linklike lt-toggle" id="lt-toggle" type="button">Show recent limit history</button>`;
  const series=limitTrendSeries(fips, UNIT_KEY[units]);
  let body;
  if(limitTrend.loading && series.length<2){ body=`<div class="lt-note">Loading recent limits…</div>`; }
  else if(limitTrend.error){ body=`<div class="lt-note">${esc(limitTrend.error)}</div>`; }
  else if(series.length<2){ body=`<div class="lt-note">Recent limit history isn't available for this county.</div>`; }
  else{
    const max=Math.max(...series.map(p=>p.v));
    const first=series[0], last=series[series.length-1];
    const pct=first.v?((last.v-first.v)/first.v*100):0;
    const summary = Math.abs(pct)<0.5
      ? `The ${units}-unit conforming limit for ${esc(r.loan.countyName||"this county")} has held near ${money(last.v)} since ${first.y}.`
      : `The ${units}-unit conforming limit for ${esc(r.loan.countyName||"this county")} ${pct>0?"rose":"fell"} from ${money(first.v)} (${first.y}) to ${money(last.v)} (${last.y}) — ${pct>0?"up":"down"} ${Math.abs(pct).toFixed(0)}%.`;
    const rows=series.map(p=>{ const w=Math.max(3,Math.round(p.v/max*100)); const cur=p.y===last.y;
      return `<div class="lt-row${cur?" cur":""}"><span class="lt-y">${p.y}</span><span class="lt-track"><span class="lt-fill" style="width:${w}%"></span></span><span class="lt-v">${money(p.v)}</span></div>`; }).join("");
    body=`<div class="lt-sum">${esc(summary)}</div><div class="lt-rows">${rows}</div>`;
  }
  return `<div class="lt"><div class="lt-head"><span class="lt-lab">Recent conforming limit · ${units}-unit</span><button class="linklike lt-toggle" id="lt-toggle" type="button">Hide</button></div>${body}</div>`;
}

async function runSnapshot(raw){
  const addr=parseAddress(raw);
  if(!addr){ error="Couldn't read that address. Use: number street, city, ST zip."; result=null; loading=false; render(); return; }
  // capture optional deal inputs from the DOM
  readDeal();
  showTrend=false; limitTrend={ loading:false, error:null, byYear:null, fips:null };
  loading=true; error=null; result=null; lastQuery=raw; render();
  try{
    const [income, oz, limits]=await Promise.all([
      callOp("Income Limits API","getIncomeLimitsByAddress",addr),
      callOp("Opportunity Zones API","validateOpportunityZoneByAddress",addr),
      getLoanLimits()
    ]);
    const inc=(income&&income.incomeLimitsList&&income.incomeLimitsList[0])||{};
    const ozr=(oz&&oz.result)||{};
    const tract=inc.fips_code||ozr.censusTractNumber;
    const loan=((limits&&limits.loanLimit)||[]).find(r=>String(r.fipsCode)===countyFips(tract))||null;
    const resolved=(oz&&oz.streetAddress)?`${oz.streetAddress}, ${oz.city}, ${oz.state} ${String(oz.zip||"").slice(0,5)}`:`${addr.number} ${addr.street}, ${addr.city}, ${addr.state} ${addr.zip}`;
    result={ income:inc, oz:ozr, loan, tract, resolved };
  }catch(e){ error="Lookup failed: "+(e&&e.message?e.message:String(e)); }
  loading=false; render();
}
function readDeal(){
  const gi=(id)=>{ const el=document.getElementById(id); return el?el.value:undefined; };
  const i=gi("d-income"), l=gi("d-loan"), u=gi("d-units");
  if(i!==undefined) deal.income=i;
  if(l!==undefined) deal.loan=l;
  if(u!==undefined) deal.units=u;
}

// ---- National Market Snapshot (workflow #2): national, current indicators ----
const MKT_MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MKT_MI={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function fmtIso(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); return m?`${MKT_MONTHS[+m[2]-1]} ${+m[3]}, ${m[1]}`:String(iso||"—"); }
const bil=(m)=> (m==null||isNaN(m)) ? "—" : "$"+(Number(m)/1000).toLocaleString("en-US",{maximumFractionDigits:1})+"B";
const cap=(s)=> String(s).charAt(0).toUpperCase()+String(s).slice(1);
const chgArrow=(p)=> Math.abs(p)<0.05?"■":(p>0?"▲":"▼");
// plain-language comparison: "2.9% lower than 4 weeks ago" / "about the same as last month"
function chgPhrase(p, period){ const a=Math.abs(p); return a<0.05 ? `about the same as ${period}` : `${a.toFixed(1)}% ${p>0?"higher":"lower"} than ${period}`; }
function isoMinusDays(iso,days){ const t=new Date(iso+"T00:00:00Z").getTime()-days*86400000; return new Date(t).toISOString().slice(0,10); }
function pickWeeksAgo(rows, latestIso, days){
  if(!Array.isArray(rows)||!rows.length) return null;
  const target=new Date(latestIso+"T00:00:00Z").getTime()-days*86400000;
  let best=null, bestDiff=Infinity;
  for(const r of rows){ const d=r&&r["week-ending-date"]; if(!d||d===latestIso) continue;
    const diff=Math.abs(new Date(d+"T00:00:00Z").getTime()-target); if(diff<bestDiff){ bestDiff=diff; best=r; } }
  return best;
}
function reduceConstr(rows){
  const rank={revised:3,preliminary:2}; const best={};
  (rows||[]).forEach(r=>{
    const mv=String(r&&r["month-and-value-type"]||"").trim().split(/\s+/); const mi=MKT_MI[mv[0]], y=+mv[1];
    if(mi==null||!y) return;
    const key=y*12+mi, rk=rank[String(r["month-label-type"]||"").trim()]||1, cur=best[key];
    if(!cur||rk>cur.rk) best[key]={ val:r["construction-spending-value"], label:`${mv[0]} ${y}`, mlabel:String(r["month-label-type"]||"").trim(), key, rk };
  });
  const arr=Object.values(best).sort((a,b)=>b.key-a.key); const latest=arr[0]||null;
  return { latest, mom: latest?arr.find(x=>x.key===latest.key-1)||null:null, yoy: latest?arr.find(x=>x.key===latest.key-12)||null:null };
}
async function runMarket(){
  market.loading=true; market.error=null; render();
  try{
    const [rali, constr]=await Promise.all([
      callOp("Refinance Application-Level Index API","getMostRecentRaliWeek",{}),
      callOp("Construction Spending API","getConstructionSpendingBySectionAndSector",{ section:"Total", sector:"Residential" })
    ]);
    let raliPrior=null; const wk=rali&&rali["week-ending-date"];
    if(wk){ try{
      const range=await callOp("Refinance Application-Level Index API","getRaliByWeekRange",{ startDate:isoMinusDays(wk,45), endDate:wk });
      raliPrior=pickWeeksAgo((range&&range["rali-dataset"])||[], wk, 28);
    }catch(e){} }
    market.result={ rali, raliPrior, constr:reduceConstr((constr&&constr.constructionSpending)||[]) };
  }catch(e){ market.error="Couldn't load the market snapshot: "+(e&&e.message?e.message:String(e)); }
  market.loading=false; market.loaded=true; render();
}

function loanCard(r){
  if(!r.loan) return `<div class="card"><div class="c-hd">${IC_HOME}<span class="c-lab">Conforming loan limit</span></div>
    <div class="c-primary" style="font-size:16px;color:var(--muted)">Not matched</div>
    <div class="c-desc">No loan-limit row for county FIPS ${esc(countyFips(r.tract)||"?")}.</div></div>`;
  const iss=(r.loan.issuers&&r.loan.issuers[0])||{};
  const units=deal.units||"1";
  const lim=iss[UNIT_KEY[units]];
  const yr=String(r.loan.reportingYear||"").slice(0,4);
  const rows=["1","2","3","4"].map(u=>`<div class="c-ref-row${u===units?" on":""}"><span class="rk">${u}-unit</span><span class="rv">${money(iss[UNIT_KEY[u]])}</span></div>`).join("");
  // optional comparison: loan amount vs applicable conforming limit (factual only)
  const L=numOf(deal.loan);
  let cmp="";
  if(L!=null && lim!=null){
    const over=L>lim, diff=Math.abs(L-lim);
    const main = over ? "Loan amount exceeds the conforming loan limit"
               : diff===0 ? "Loan amount is at the conforming loan limit"
               : "Loan amount is below the conforming loan limit";
    const sub = diff===0 ? `${money(L)} equals the applicable ${money(lim)} limit.`
              : `${money(L)} is ${money(diff)} ${over?"above":"below"} the applicable ${money(lim)} limit.`;
    cmp=`<div class="cmp ${over?"over":"ok"}"><div class="cmp-main"><span class="cmp-ic">${over?"⚠":"✓"}</span><span>${main}</span></div><div class="cmp-sub">${sub}</div></div>`;
  }
  return `<div class="card"><div class="c-hd">${IC_HOME}<span class="c-lab">Conforming loan limit</span></div>
    <div class="c-primary">${money(lim)}</div>
    <div class="c-desc">${units}-unit property · ${esc(r.loan.countyName||"")}, ${esc(r.loan.stateCode||"")}</div>
    ${cmp}
    <div class="c-ref">${rows}</div>
    <div class="c-src">FHFA conforming limit · ${esc(yr||"current")}</div>
    ${limitTrendHtml(r, units)}
    <details class="means"><summary>What does this mean?</summary><p>${esc(MEANS.loan)}</p></details>
  </div>`;
}

    const sk=(ic,lab)=>`<div class="card"><div class="c-hd">${ic}<span class="c-lab">${lab}</span></div><div class="sk"></div><div class="sk sm"></div></div>`;
    return `<div class="mkt-tools"><span class="lu-hint">Loading current national indicators…</span></div>
      <div class="cards two">${sk(IC_CASH,"Refinance activity")}${sk(IC_BUILD,"New residential construction")}</div>`;
  }
  if(market.error) return `<div class="err"><b>Something went wrong</b>${esc(market.error)}</div>`;
  if(!market.result) return `<div class="mkt-tools"><button class="linklike" id="mkt-load" type="button">Load snapshot</button></div>`;
  return `<div class="mkt-tools"><button class="linklike" id="mkt-refresh" type="button">↻ Refresh</button></div>
    <div class="cards two">${raliCard(market.result)}${constrCard(market.result)}</div>
    <div class="support">
      <div class="disclaimer">These are <b>national market indicators for context</b>, current as of the dates shown — <b>not a rate quote, a forecast, or advice to buy, sell, or refinance</b>.</div>
      <div class="sources">Sources: Fannie Mae Refinance Application-Level Index and Construction Spending APIs.</div>
    </div>`;
}
function raliCard(r){
  const wk=r.rali||{}; const vi=wk["volume-index"]; const co=wk["cash-out-volume"], rt=wk["rate-term-volume"];
  const asof=fmtIso(wk["week-ending-date"]);
  const mix=(co!=null&&rt!=null)?(co>rt?"mostly cash-out":(rt>co?"mostly rate/term":"an even cash-out and rate/term mix")):"";
  let trend="", interp="", baseNote="";
  if(r.raliPrior && r.raliPrior["volume-index"]){
    const pv=r.raliPrior["volume-index"], p=(vi-pv)/pv*100;
    trend=`<div class="trend"><span class="tr-ar">${chgArrow(p)}</span> ${cap(chgPhrase(p,"4 weeks ago"))}</div>`;
    interp=`Refinance applications are ${chgPhrase(p,"4 weeks ago")}${mix?" — currently "+mix:""}.`;
    baseNote=`<div class="c-src">Compared with the week ending ${fmtIso(r.raliPrior["week-ending-date"])} (index ${pv})</div>`;
  } else {
    interp=`Refinance application index is ${vi==null?"—":vi} as of ${asof}${mix?" — currently "+mix:""}.`;
  }
  return `<div class="card mkt"><div class="c-hd">${IC_CASH}<span class="c-lab">Refinance activity</span></div>
    <div class="interp">${esc(interp)}</div>
    <div class="c-primary">${vi==null?"—":vi}</div>
    <div class="c-desc">Refinance application volume index (higher = more applications)</div>
    ${trend}
    <div class="c-ref">
      <div class="c-ref-row"><span class="rk">Cash-out index</span><span class="rv">${co==null?"—":co}</span></div>
      <div class="c-ref-row"><span class="rk">Rate/term index</span><span class="rv">${rt==null?"—":rt}</span></div>
    </div>
    ${baseNote}
    <div class="c-src">Fannie Mae RALI · week ending ${asof}</div>
    <details class="means"><summary>What does this mean?</summary><p>${esc(MEANS_MKT.rali)}</p></details>
  </div>`;
}
function constrCard(r){
  const c=r.constr||{}; const latest=c.latest;
  if(!latest) return `<div class="card mkt"><div class="c-hd">${IC_BUILD}<span class="c-lab">New residential construction</span></div>
    <div class="c-primary" style="font-size:16px;color:var(--muted)">Unavailable</div>
    <div class="c-desc">No residential construction figure was returned.</div></div>`;
  let trend="", interp="";
  if(c.mom && c.mom.val){
    const p=(latest.val-c.mom.val)/c.mom.val*100;
    trend=`<div class="trend"><span class="tr-ar">${chgArrow(p)}</span> ${cap(chgPhrase(p,"last month"))}</div>`;
    interp=`Residential construction spending is ${chgPhrase(p,"last month")} (${bil(latest.val)} at an annual rate).`;
  } else {
    interp=`Residential construction spending is ${bil(latest.val)} at an annual rate as of ${latest.label}.`;
  }
  const momRow = c.mom && c.mom.val ? `<div class="c-ref-row"><span class="rk">Prior month (${esc(c.mom.label)})</span><span class="rv">${bil(c.mom.val)}</span></div>` : "";
  const yoyRow = c.yoy && c.yoy.val ? `<div class="c-ref-row"><span class="rk">Year ago (${esc(c.yoy.label)})</span><span class="rv">${bil(c.yoy.val)}</span></div>` : "";
  return `<div class="card mkt"><div class="c-hd">${IC_BUILD}<span class="c-lab">New residential construction</span></div>
    <div class="interp">${esc(interp)}</div>
    <div class="c-primary">${bil(latest.val)}</div>
    <div class="c-desc">Residential construction spending, annual rate — ${esc(latest.label)}${latest.mlabel?" ("+esc(latest.mlabel)+")":""}</div>
    ${trend}
    <div class="c-ref">${momRow}${yoyRow}</div>
    <div class="c-src">Fannie Mae Construction Spending · ${esc(latest.label)}</div>
    <details class="means"><summary>What does this mean?</summary><p>${esc(MEANS_MKT.constr)}</p></details>
  </div>`;
}

function render(){
  try{ document.documentElement.classList.toggle("dark", ctx().theme==="dark"); }catch{}
  document.body.classList.toggle("fs", isFs());
  document.body.classList.toggle("inline", !isFs());
  const root=document.getElementById("root");
  root.innerHTML=(view==="snapshot")?snapshotHtml():(view==="market")?marketHtml():homeHtml();
  wire(root);
}
function wire(root){
  wireDisplay(root);
  root.querySelectorAll("[data-open]").forEach(b=> b.addEventListener("click",()=>{
    view=b.dataset.open;
    if(view==="market"){ if(!market.loaded && !market.loading) runMarket(); else render(); return; }
    result=null; error=null; lastQuery=""; showDeal=false; deal={income:"",loan:"",units:"1"}; showTrend=false; limitTrend={ loading:false, error:null, byYear:null, fips:null }; render();
  }));
  const mrf=root.querySelector("#mkt-refresh"); if(mrf) mrf.addEventListener("click",()=>{ market.loaded=false; runMarket(); });
  const mld=root.querySelector("#mkt-load"); if(mld) mld.addEventListener("click",()=> runMarket());
  const oe=root.querySelector("#openexp"); if(oe) oe.addEventListener("click", async ()=>{ try{ await app.openLink({ url:DATA.explorerUrl }); }catch(e){} });
  const back=root.querySelector("#back"); if(back) back.addEventListener("click",()=>{ view="home"; render(); });
  const input=root.querySelector("#addr"), go=root.querySelector("#go");
  const submit=()=>{ const v=(input&&input.value||"").trim(); if(v&&!loading) runSnapshot(v); };
  if(go) go.addEventListener("click", submit);
  // keep the typed address in sync so a re-render (e.g. toggling deal details) never wipes it
  if(input) input.addEventListener("input",(e)=>{ lastQuery=e.target.value; });
  if(input) input.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submit(); });
  const ex=root.querySelector("#tryex"); if(ex) ex.addEventListener("click",()=>{ readDeal(); lastQuery=EXAMPLE; runSnapshot(EXAMPLE); });
  const ad=root.querySelector("#adddeal"); if(ad) ad.addEventListener("click",()=>{ readDeal(); showDeal=!showDeal; render(); });
  const du=root.querySelector("#d-units"); if(du) du.addEventListener("change",()=>{ readDeal(); if(result) render(); });
  ["d-income","d-loan"].forEach(id=>{ const el=root.querySelector("#"+id); if(el){ formatMoneyInput(el); el.addEventListener("input",()=>formatMoneyInput(el)); } });
  const clr=root.querySelector("#clear"); if(clr) clr.addEventListener("click",()=>{ result=null; error=null; lastQuery=""; showTrend=false; limitTrend={ loading:false, error:null, byYear:null, fips:null }; render(); const f=document.getElementById("addr"); if(f) f.focus(); });
  const ltt=root.querySelector("#lt-toggle"); if(ltt) ltt.addEventListener("click",()=>{ showTrend=!showTrend; if(showTrend) loadLimitTrend(); else render(); });
}

(async()=>{
  app=new App({name:"FnmaBusinessDashboard",version:"0.3.0"},{availableDisplayModes:["inline","fullscreen"]},{autoResize:true});
  app.ontoolresult=(res)=>{ try{ DATA=res?.structuredContent ?? JSON.parse(res.content[0].text); }catch{ DATA=DATA||{}; } render(); };
  app.onhostcontextchanged=()=>render();
  await app.connect();
  render();
  console.log("[fnma business dashboard] PoC v0.3 — DEV:", DEV);
})();
</script>

<!doctype html>
<meta charset="utf-8" />
<!--
  Fannie Mae API catalog -- self-contained app (list + detail views).

  List view: all APIs as grouped cards (by business line or function).
  Detail view: clicking a live/down card opens that API IN-PLACE (the catalog
  already carries each API's operations in its data, so navigation needs no
  server call and no Claude prompt). Operations Run DIRECTLY via the ext-apps
  bridge (app.callServerTool "call_fnma_api") and render the result inline --
  no Claude round-trip, no Enter. A Back button returns to the list.

  Card states: live (green), down (amber, upstream 404), static (catalog only).
  Display modes: App declares inline/fullscreen/pip; header toggle only shows
  a control for a mode the host advertises.
-->
<style>
  /*__BRAND__*/
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--font);color:var(--body);background:var(--paper);font-size:13px;color-scheme:light dark}
  #root{max-width:920px;margin:0 auto}
  .hd{padding:14px 16px 10px}
  .hd h1{font-size:14px;font-weight:700;color:var(--accent);margin:0;text-transform:uppercase;letter-spacing:.04em}
  .hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .hd-left{display:flex;align-items:center;gap:10px;min-width:0}
  .detail-h1{font-size:14px;font-weight:700;color:var(--accent);margin:0;line-height:1.2}
  .back-btn{border:1px solid var(--slate);background:var(--paper);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .back-btn:hover{color:var(--body);border-color:var(--muted)}
  .back-btn:active{opacity:.65}
  .stats{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--body);font-weight:700}
  .stats b.warn{color:var(--watch)}
  .desc{font-size:11px;color:var(--muted);line-height:1.4}
  .hd .desc{margin-top:4px}
  .disp{display:inline-flex;gap:5px;flex:0 0 auto}
  .disp-btn{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--slate);border-radius:6px;padding:5px 9px;cursor:pointer;line-height:1}
  .disp-btn:hover{color:var(--body);border-color:var(--muted)}
  .disp-btn:active{opacity:.65}
  .disp-btn > span[aria-hidden]{font-size:12px}
  .controls{display:flex;gap:8px;align-items:center;margin:8px 16px 4px;flex-wrap:wrap}
  .controls input{flex:1 1 220px;min-width:0;border:1px solid var(--slate);border-radius:6px;padding:7px 10px;font-size:12px;background:var(--paper);color:var(--body)}
  .controls input:focus{outline:2px solid var(--pass);outline-offset:-1px}
  .seg{display:flex;border:1px solid var(--slate);border-radius:6px;overflow:hidden;flex:0 0 auto}
  .seg button{border:none;background:var(--paper);color:var(--muted);font-size:10.5px;font-weight:700;padding:7px 11px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--accent);color:var(--paper)}
  .seg button:not(.on):hover{color:var(--body)}
  .group{padding:4px 16px}
  .group-hd{display:flex;align-items:center;gap:6px;margin:12px 0 6px}
  .group-hd svg{width:13px;height:13px;color:var(--muted);flex:0 0 auto}
  .group-lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .group-count{font-size:10px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .card{border:1px solid var(--line);border-radius:7px;padding:11px 13px;background:var(--off);transition:box-shadow .12s,transform .12s}
  .card.live{border-left:3px solid var(--pass);cursor:pointer;background:var(--pass-bg);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card.live:hover{box-shadow:0 3px 10px rgba(0,0,0,.10);transform:translateY(-1px)}
  .card.down{border-left:3px solid var(--watch);cursor:pointer;background:var(--watch-bg);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card.down:hover{box-shadow:0 3px 10px rgba(0,0,0,.10);transform:translateY(-1px)}
  .card.static{border-left:3px solid var(--slate);background:var(--off)}
  .name{font-weight:700;font-size:12px;margin-bottom:3px}
  .meta{font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.03em}
  .badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--pass);color:var(--paper)}
  .badge.down{background:var(--watch);color:var(--paper)}
  .badge.static{background:transparent;color:var(--muted);border:1px solid var(--slate)}
  .why{font-size:9.5px;color:var(--watch);line-height:1.4;margin-top:6px}
  .empty-group{border:1px dashed var(--slate);border-radius:7px;padding:11px 13px;font-size:11px;color:var(--muted);line-height:1.45;grid-column:1/-1}
  .no-results{padding:20px 16px;color:var(--muted);text-align:center;font-size:12px}
  /* --- detail view (ported from api-detail) --- */
  .op{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 16px}
  .op-lab{font-weight:700;font-size:12px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .verb{font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted);background:var(--off)}
  .verb.post{color:var(--paper);background:var(--accent);border-color:var(--accent)}
  .op-note{font-size:10.5px;color:var(--muted);line-height:1.4;margin:-2px 0 7px}
  .op-params{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .op-params input{border:1px solid var(--slate);border-radius:4px;padding:4px 7px;font-size:11.5px;background:var(--paper);color:var(--body);width:120px}
  .op-params label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px}
  .opt{opacity:.7;font-style:italic}
  .hint{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .ilist{flex:1 1 100%;min-width:0}
  .ilist-row{display:flex;gap:5px;align-items:center;margin-bottom:4px}
  .ilist-row input{width:auto;flex:1 1 0;min-width:0}
  .del-row{border:1px solid var(--slate);border-radius:4px;background:var(--paper);color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:4px 7px;flex:0 0 auto}
  .del-row:hover{color:var(--body)}
  .add-row{border:1px dashed var(--slate);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;font-size:10.5px;padding:3px 9px;margin-top:2px}
  .add-row:hover{color:var(--accent);border-color:var(--accent)}
  .run-btn{border:none;border-radius:4px;padding:5px 12px;font-size:11px;font-weight:700;background:var(--accent);color:var(--paper);cursor:pointer}
  .run-btn:hover{opacity:.85}
  .run-btn:disabled{opacity:.6;cursor:default}
  .result{margin-top:8px;background:var(--off);border-radius:4px;padding:8px;font-size:11px;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace}
  .result.err{color:var(--watch)}
  .not-implemented{padding:12px 16px;color:var(--muted);font-size:12px}
  .down-banner{margin:8px 16px;border:1px solid var(--watch);background:var(--watch-bg);border-radius:6px;padding:9px 11px;font-size:11px;color:var(--watch);line-height:1.45}
  .down-banner b{display:block;font-size:11px;margin-bottom:3px}
  /* --- tap feedback --- */
  .card.live:active,.card.down:active{transform:scale(.985)}
  .seg button:active{opacity:.65}
  .run-btn:active{transform:scale(.97);opacity:.9}
  .add-row:active,.del-row:active{background:var(--off)}
  /* --- mobile --- */
  @media (max-width:480px){
    #root{max-width:100%}
    .grid{grid-template-columns:1fr}
    .controls input{flex:1 1 100%}
    .seg{width:100%}
    .seg button{flex:1 1 0;padding:10px 8px;font-size:11px}
    .disp-lab{display:none}
    .op-params{gap:8px}
    .op-params > div{flex:1 1 100%}
    .op-params input[data-param]{width:100%}
    .run-btn{width:100%;padding:10px;font-size:12px}
    .add-row,.del-row{padding:7px 11px}
  }
</style>
<div id="root"><div style="padding:26px 16px;color:var(--muted);text-align:center">Loading catalog…</div></div>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;
const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const TAG_ICONS = {
  "Originating & Underwriting": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1m-6 4h1m4 0h1m-6 4h1m4 0h1"/></svg>',
  "Pricing & Execution": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  "Servicing": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/><circle cx="12" cy="12" r="3"/></svg>',
  "Single Family": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
};
const BL_ICONS = {
  "Single Family": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
  "Multifamily": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V4h6v17M12 21V9h6v12M8 8h2m-2 4h2m-2 4h2m4-4h2m-2 4h2"/></svg>',
  "Both": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21h20M4 21V11l5-4 5 4v10M14 21V8l5-3v16M6.5 13h1m-1 3h1m10-6h.01m-.01 3h.01"/></svg>',
  "Market & Reference": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>',
};
const DEFAULT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>';

const EMPTY_GROUP_NOTE = {
  "Multifamily": "No API in this catalog is multifamily-only. Pool Prefix is the only one that covers multifamily at all, and it covers both business lines — you will find it under Both.",
};

let DATA=null, app=null, query="", groupBy="businessLine";
let view="list", selectedName=null;
const RESULTS={};
const ctx=()=>app?.getHostContext?.()||{};

// --- display-mode toggle ---------------------------------------------------
const DISPLAY_META={fullscreen:["⛶","Full screen"],pip:["◲","Pop out"],inline:["▭","Collapse"]};
function displayControlsHtml(){
  const c=ctx();
  const avail=Array.isArray(c.availableDisplayModes)?c.availableDisplayModes:[];
  const cur=c.displayMode||"inline";
  const btns=["fullscreen","pip","inline"]
    .filter(m=>avail.includes(m)&&m!==cur)
    .map(m=>{const[g,l]=DISPLAY_META[m];
      return `<button type="button" class="disp-btn" data-mode="${m}" title="${esc(l)}"><span aria-hidden="true">${g}</span><span class="disp-lab">${esc(l)}</span></button>`;})
    .join("");
  return btns?`<div class="disp">${btns}</div>`:"";
}
function wireDisplay(scope){
  (scope||document).querySelectorAll(".disp-btn").forEach(b=>{
    b.addEventListener("click",()=>{ try{ app.requestDisplayMode&&app.requestDisplayMode(b.dataset.mode); }catch(e){ console.warn("[fnma] requestDisplayMode failed:",e); } });
  });
}

// --- detail-view helpers ---------------------------------------------------
function splitExample(example){
  return String(example==null?"":example)
    .split("|").map(s=>s.trim()).filter(Boolean)
    .map(item=>item.split("/").map(p=>p.trim()));
}
function itemRowHtml(fields, values){
  const inputs = fields.map((f,i)=>
    `<input type="text" data-field="${esc(f)}" placeholder="${esc(values && values[i] ? values[i] : f)}" />`
  ).join("");
  return `<div class="ilist-row">${inputs}<button class="del-row" type="button" title="Remove row">&times;</button></div>`;
}
function paramControl(p){
  if(p.kind === "itemList"){
    const fields = p.fields || [];
    const rows = splitExample(p.example).map(vals=>itemRowHtml(fields, vals)).join("")
      || itemRowHtml(fields, null);
    return `<div class="ilist" data-param="${esc(p.name)}" data-fields="${esc(fields.join(","))}">
      <label>${esc(p.name)} <span class="opt">(${esc(fields.join(" / "))})</span></label>
      <div class="ilist-rows">${rows}</div>
      <button class="add-row" type="button">+ Add row</button>
      ${p.hint ? `<div class="hint">${esc(p.hint)}</div>` : ""}
    </div>`;
  }
  return `<div>
    <label>${esc(p.name)}${p.optional ? ' <span class="opt">optional</span>' : ""}</label>
    <input type="text" data-param="${esc(p.name)}" placeholder="${esc(String(p.example))}" />
    ${p.hint ? `<div class="hint">${esc(p.hint)}</div>` : ""}
  </div>`;
}
function readItemList(listEl, fields){
  return [...listEl.querySelectorAll(".ilist-row")].map(row=>{
    const vals = fields.map(f=>{
      const input = row.querySelector(`input[data-field="${f}"]`);
      return ((input && (input.value || input.placeholder)) || "").trim();
    });
    while(vals.length && !vals[vals.length-1]) vals.pop();
    return vals.join("/");
  }).filter(Boolean).join(" | ");
}
function collectArgs(op, opEl, entry){
  const args = { api_name: entry.name, operation_id: op.id };
  (op.params||[]).forEach(p=>{
    if(p.kind === "itemList"){
      const listEl = opEl.querySelector(`.ilist[data-param="${p.name}"]`);
      const fields = (listEl.dataset.fields||"").split(",").filter(Boolean);
      const val = readItemList(listEl, fields) || p.example;
      if(val) args[p.name] = val;
    } else {
      const input = opEl.querySelector(`input[data-param="${p.name}"]`);
      const val = (input?.value || (p.optional ? "" : p.example));
      if(val) args[p.name] = val;
    }
  });
  return args;
}

// --- list-view helpers -----------------------------------------------------
const isDown = (a)=> !!a.implemented && a.status === "unreachable";
const keyOf = (a)=> groupBy === "businessLine" ? (a.businessLine || "Market & Reference") : a.tag;
const otherOf = (a)=> groupBy === "businessLine" ? a.tag : (a.businessLine || "Market & Reference");
function matches(api){
  if(!query) return true;
  const q = query.toLowerCase();
  return [api.name, api.description, api.tag, api.businessLine||""]
    .some(v => String(v).toLowerCase().includes(q));
}
function groupOrder(apis){
  if(groupBy === "businessLine"){
    const declared = DATA?.businessLineOrder || [];
    const seen = [...new Set(apis.map(keyOf))];
    return [...declared, ...seen.filter(k=>!declared.includes(k))];
  }
  return [...new Set(apis.map(keyOf))];
}
const selectedEntry=()=> (DATA?.apis||[]).find(a=>a.name===selectedName) || null;

// --- render dispatch -------------------------------------------------------
function render(){
  const root=document.getElementById("root");
  const apis = DATA?.apis||[];
  if(apis.length===0){ root.innerHTML='<div style="padding:26px 16px;color:var(--muted);text-align:center">No APIs found.</div>'; return; }
  if(view==="detail" && selectedEntry()) renderDetail();
  else { view="list"; renderList(); }
}

function renderList(){
  const root=document.getElementById("root");
  const apis = DATA?.apis||[];
  const downCount = apis.filter(isDown).length;
  const liveCount = apis.filter(a=>a.implemented && !isDown(a)).length;
  const visible = apis.filter(matches);
  const icons = groupBy === "businessLine" ? BL_ICONS : TAG_ICONS;

  const sections = groupOrder(apis).map(g=>{
    const groupApis = visible.filter(a=>keyOf(a)===g);
    const showEmpty = groupApis.length===0 && !query && groupBy==="businessLine" && EMPTY_GROUP_NOTE[g];
    if(groupApis.length===0 && !showEmpty) return "";
    const body = showEmpty
      ? `<div class="empty-group">${esc(EMPTY_GROUP_NOTE[g])}</div>`
      : groupApis.map(a=>{
          const down = isDown(a);
          const cls = down ? "down" : a.implemented ? "live" : "static";
          const badge = down
            ? '<span class="badge down">● UNREACHABLE</span>'
            : a.implemented
              ? '<span class="badge">● LIVE</span>'
              : '<span class="badge static">● Catalog only</span>';
          const why = down && a.statusNote ? `<div class="why">${esc(a.statusNote)}</div>` : "";
          return `
          <div class="card ${cls}" data-name="${esc(a.name)}">
            <div class="name">${esc(a.name)}</div>
            <div class="desc">${esc(a.description)}</div>
            <div class="badges">${badge}</div>
            <div class="meta">${esc(otherOf(a))}</div>
            ${why}
          </div>`;
        }).join("");
    return `<div class="group">
      <div class="group-hd">${icons[g]||DEFAULT_ICON}<span class="group-lab">${esc(g)}</span><span class="group-count">(${groupApis.length})</span></div>
      <div class="grid">${body}</div>
    </div>`;
  }).join("");

  root.innerHTML = `<div class="hd">
      <div class="hd-top"><h1>Fannie Mae Public APIs</h1>${displayControlsHtml()}</div>
      <div class="stats"><span><b>${apis.length}</b> total APIs</span><span><b>${liveCount}</b> live in this connector</span>${downCount?`<span><b class="warn">${downCount}</b> unreachable</span>`:""}<span><b>${apis.length-liveCount-downCount}</b> catalog-only</span></div>
    </div>
    <div class="controls">
      <input type="text" id="q" placeholder="Search APIs by name, category, or description…" value="${esc(query)}" />
      <div class="seg">
        <button type="button" data-group="businessLine" class="${groupBy==="businessLine"?"on":""}">Business line</button>
        <button type="button" data-group="tag" class="${groupBy==="tag"?"on":""}">Function</button>
      </div>
    </div>
    ${visible.length===0 ? '<div class="no-results">No APIs match your search.</div>' : sections}`;

  root.querySelectorAll(".card.live, .card.down").forEach(card=>{
    card.addEventListener("click", ()=>{ selectedName = card.dataset.name; view = "detail"; render(); });
  });
  root.querySelectorAll(".seg button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ groupBy = btn.dataset.group; render(); });
  });
  const searchInput = root.querySelector("#q");
  if(searchInput){
    searchInput.addEventListener("input", (e)=>{
      query = e.target.value;
      render();
      const freshInput = document.getElementById("q");
      if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(query.length, query.length); }
    });
  }
  wireDisplay(root);
}

function renderDetail(){
  const root=document.getElementById("root");
  const entry=selectedEntry();
  if(!entry){ view="list"; renderList(); return; }

  const head = `<div class="hd"><div class="hd-top">
      <div class="hd-left"><button type="button" class="back-btn">← All APIs</button><div class="detail-h1">${esc(entry.name)}</div></div>
      ${displayControlsHtml()}
    </div><div class="desc">${esc(entry.description)}</div></div>`;

  if(!entry.implemented){
    root.innerHTML = head + `<div class="not-implemented">This API isn't wired up to live data in this connector yet -- catalog entry only.</div>`;
    wireBack(root); wireDisplay(root); return;
  }

  const downBanner = entry.status === "unreachable"
    ? `<div class="down-banner"><b>Unreachable at Fannie Mae</b>${esc(entry.statusNote || "This API is not currently responding.")}</div>`
    : "";

  const ops = (entry.operations||[]).map(op=>{
    const method = (op.method || "GET").toUpperCase();
    const verb = `<span class="verb ${method === "POST" ? "post" : ""}">${esc(method)}</span>`;
    const inputs = (op.params||[]).map(paramControl).join("");
    const note = op.note ? `<div class="op-note">${esc(op.note)}</div>` : "";
    const data = RESULTS[`${entry.name}::${op.id}`];
    const isErr = data && typeof data === "object" && "error" in data;
    const resultBlock = (data!==undefined)
      ? `<div class="result${isErr ? " err" : ""}">${esc(isErr ? data.error : JSON.stringify(data, null, 2))}</div>`
      : "";
    return `<div class="op" data-op="${esc(op.id)}">
      <div class="op-lab">${verb}${esc(op.label)}</div>
      ${note}
      <div class="op-params">${inputs}</div>
      <button class="run-btn" type="button">Run</button>
      ${resultBlock}
    </div>`;
  }).join("");

  root.innerHTML = head + downBanner + ops;

  root.querySelectorAll(".op").forEach(opEl=>{
    const op = (entry.operations||[]).find(o=>o.id===opEl.dataset.op);

    opEl.querySelectorAll(".ilist").forEach(listEl=>{
      const fields = (listEl.dataset.fields||"").split(",").filter(Boolean);
      const rowsEl = listEl.querySelector(".ilist-rows");
      listEl.querySelector(".add-row").addEventListener("click", ()=>{
        rowsEl.insertAdjacentHTML("beforeend", itemRowHtml(fields, null));
      });
      rowsEl.addEventListener("click", (e)=>{
        const btn = e.target.closest(".del-row");
        if(!btn) return;
        if(rowsEl.querySelectorAll(".ilist-row").length > 1) btn.parentElement.remove();
      });
    });

    opEl.querySelector(".run-btn").addEventListener("click", async ()=>{
      const args = collectArgs(op, opEl, entry);
      const btn = opEl.querySelector(".run-btn");
      btn.disabled = true; btn.textContent = "Running…";
      try{
        const result = await app.callServerTool({ name: "call_fnma_api", arguments: args });
        let data;
        if(result && result.isError){
          data = { error: (result.content && result.content[0] && result.content[0].text) || "Tool returned an error." };
        } else {
          const text = result && result.content && result.content[0] && result.content[0].text;
          try{ data = JSON.parse(text); }catch{ data = text ? { raw: text } : (result && result.structuredContent) || {}; }
        }
        RESULTS[`${entry.name}::${op.id}`] = data;
      }catch(e){
        RESULTS[`${entry.name}::${op.id}`] = { error: String(e && e.message ? e.message : e) };
      }
      renderDetail();
    });
  });

  wireBack(root); wireDisplay(root);
}

function wireBack(scope){
  const b = scope.querySelector(".back-btn");
  if(b) b.addEventListener("click", ()=>{ view="list"; selectedName=null; render(); });
}

(async()=>{
  app=new App({name:"FnmaCatalog",version:"1.0.0"},{availableDisplayModes:["inline","fullscreen","pip"]},{autoResize:true});
  const theme=()=>{try{document.documentElement.classList.toggle("dark",ctx().theme==="dark")}catch{}};
  app.ontoolresult=(result)=>{ try{ DATA=result?.structuredContent ?? JSON.parse(result.content[0].text); }catch{ DATA=null; } view="list"; selectedName=null; theme(); render(); };
  app.onhostcontextchanged=()=>{ theme(); render(); };
  await app.connect();
  console.log("[fnma catalog] host availableDisplayModes:", ctx().availableDisplayModes, "| current:", ctx().displayMode);
  theme(); render();
})();
</script>
